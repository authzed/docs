<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e6b63" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d4de0" />
    </marker>
  </defs>

  <rect width="1220" height="640" fill="#ffffff" />

  <!-- Containers -->
  <rect x="30" y="120" width="510" height="400" rx="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6" />
  <text x="46" y="106" font-size="18" font-style="italic" fill="#3f3f46">AuthZed Materialize</text>

  <rect x="640" y="110" width="210" height="360" rx="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6" />
  <text x="656" y="96" font-size="18" font-style="italic" fill="#3f3f46">SpiceDB</text>

  <rect x="950" y="95" width="240" height="465" rx="14" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="8 6" />
  <text x="966" y="81" font-size="18" font-style="italic" fill="#3f3f46">Your Systems</text>

  <!-- Boxes: AuthZed Materialize (2x2 grid: Hydrator/Cache Server top, Snapshotter/Event Log bottom) -->
  <!-- Shifted down 60px from the original grid so Cache Server's center (200) lines up with SpiceDB's center (200), keeping the dispatch line straight -->
  <g>
    <rect x="60" y="150" width="170" height="90" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="145" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Hydrator</text>
    <text x="145" y="212" text-anchor="middle" font-size="12.5" fill="#3f3f46">computes permission sets</text>
    <text x="145" y="227" text-anchor="middle" font-size="12.5" fill="#3f3f46">for watched permissions</text>
  </g>

  <g>
    <rect x="320" y="150" width="190" height="100" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="415" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Cache Server</text>
    <text x="415" y="212" text-anchor="middle" font-size="12.5" fill="#3f3f46">serves hydrated</text>
    <text x="415" y="227" text-anchor="middle" font-size="12.5" fill="#3f3f46">permission sets</text>
  </g>

  <g>
    <rect x="60" y="400" width="170" height="90" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="145" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Snapshotter</text>
    <text x="145" y="462" text-anchor="middle" font-size="12.5" fill="#3f3f46">periodic snapshots</text>
    <text x="145" y="477" text-anchor="middle" font-size="12.5" fill="#3f3f46">of schema + relationships</text>
  </g>

  <g>
    <rect x="320" y="400" width="190" height="90" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="415" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Event Log</text>
    <text x="415" y="462" text-anchor="middle" font-size="12.5" fill="#3f3f46">persists permission set changes</text>
  </g>

  <!-- Boxes: SpiceDB -->
  <g>
    <rect x="660" y="150" width="170" height="100" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="745" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">SpiceDB</text>
    <text x="745" y="227" text-anchor="middle" font-size="12.5" fill="#3f3f46">the service</text>
  </g>

  <g>
    <rect x="660" y="330" width="170" height="100" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="745" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Datastore</text>
    <text x="745" y="397" text-anchor="middle" font-size="12.5" fill="#3f3f46">underlying storage</text>
  </g>

  <!-- Boxes: Your Systems -->
  <g>
    <rect x="970" y="125" width="200" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="1070" y="170" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Your Application</text>
    <text x="1070" y="195" text-anchor="middle" font-size="12" fill="#3f3f46">calls SpiceDB exactly as</text>
    <text x="1070" y="211" text-anchor="middle" font-size="12" fill="#3f3f46">it always has</text>
  </g>

  <g>
    <rect x="970" y="310" width="200" height="90" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="1070" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Event Processor</text>
    <text x="1070" y="367" text-anchor="middle" font-size="11.5" fill="#3f3f46">backfills + watches</text>
    <text x="1070" y="382" text-anchor="middle" font-size="11.5" fill="#3f3f46">permission sets</text>
  </g>

  <g>
    <rect x="970" y="430" width="200" height="100" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" />
    <text x="1070" y="465" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">Your Database</text>
    <text x="1070" y="487" text-anchor="middle" font-size="11.5" fill="#3f3f46">or search index</text>
    <text x="1070" y="502" text-anchor="middle" font-size="11.5" fill="#3f3f46">(colocated permissions)</text>
  </g>

  <!-- Arrows -->
  <!-- 1: Snapshotter -> Hydrator (same column, straight up) -->
  <path d="M145,400 V242" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" />
  <text x="160" y="325" font-size="12" fill="#1a1a1a">snapshot</text>

  <!-- 2: Hydrator -> Cache Server (same row, straight across) -->
  <path d="M228,197 H318" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" />
  <text x="273" y="176" text-anchor="middle" font-size="11.5" fill="#1a1a1a">hydrated</text>
  <text x="273" y="189" text-anchor="middle" font-size="11.5" fill="#1a1a1a">permission sets</text>

  <!-- 3: Cache Server -> Event Log (same column, straight down) -->
  <path d="M415,252 V398" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" />
  <text x="405" y="310" text-anchor="end" font-size="12" fill="#1a1a1a">permission set</text>
  <text x="405" y="325" text-anchor="end" font-size="12" fill="#1a1a1a">changes</text>

  <!-- 4: SpiceDB <-> Datastore -->
  <path d="M745,250 V328" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)" />
  <text x="745" y="293" text-anchor="middle" font-size="11.5" fill="#1a1a1a">reads / writes</text>

  <!-- 5: Datastore -> Snapshotter, routed via the bottom margin -->
  <path d="M660,410 H600 V545 H145 V492" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" />
  <text x="400" y="562" text-anchor="middle" font-size="12" fill="#1a1a1a">schema + relationships</text>

  <!-- 6: SpiceDB <-> Cache Server (Accelerated Queries dispatch) — both centered at y=200, now a single straight line -->
  <path d="M660,200 H512" fill="none" stroke="#2e6b63" stroke-width="2.5" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)" />
  <text x="586" y="180" text-anchor="middle" font-size="11.5" fill="#2e6b63" font-weight="600">Accelerated</text>
  <text x="586" y="193" text-anchor="middle" font-size="11.5" fill="#2e6b63" font-weight="600">Queries</text>

  <!-- 7: Datastore -> Cache Server (direct real-time watch) — enters Cache Server's bottom edge via the gap below it, so it never crosses the dispatch line at y=200 -->
  <path d="M660,350 H600 V300 H460 V252" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 6" marker-end="url(#arrow-neutral)" />
  <text x="605" y="315" text-anchor="middle" font-size="11.5" fill="#1a1a1a">watches datastore</text>
  <text x="605" y="329" text-anchor="middle" font-size="11.5" fill="#1a1a1a">directly (real-time)</text>

  <!-- 8: SpiceDB <-> Your Application (normal SpiceDB API calls, unchanged by Materialize) — short, direct path -->
  <path d="M830,200 H968" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)" />
  <text x="899" y="188" text-anchor="middle" font-size="11.5" fill="#1a1a1a">checks &amp; lookups</text>

  <!-- 9: Event Log <-> Event Processor (Event Streams), routed via the bottom margin, well below the schema + relationships line -->
  <path d="M415,490 V585 H920 V355 H968" fill="none" stroke="#6d4de0" stroke-width="2.5" marker-end="url(#arrow-violet)" marker-start="url(#arrow-violet)" />
  <text x="650" y="573" text-anchor="middle" font-size="12.5" fill="#6d4de0" font-weight="600">Event Streams</text>

  <!-- 10: Event Processor -> Your Database -->
  <path d="M1070,400 V428" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrow-neutral)" />
  <text x="1095" y="418" font-size="12" fill="#1a1a1a">stores permission sets</text>
</svg>
