<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" font-family="Inter, system-ui, sans-serif">
  <!-- Redrawn against AuthZed's Sandworm design system (github.com/authzed/design/tree/main/sandworm):
       - containers = dashed "7 3" scope boundaries; nodes = solid 1px cards (design/diagrams.md)
       - connectors = orthogonal, 1.5px, rounded 10px corners, stone-400 neutral / teal-400 "active path" (dispatch)
       - container labels = mono-caps, riding the dashed edge
       - violet for Event Streams is a deliberate extension beyond the strict diagram canon (which only
         defines stone/teal/red), kept consistent with the violet already used for this feature in
         components/feature-badge.css and feature-notes.css elsewhere in this codebase. -->
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8e8891" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#72b1ad" />
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5ce6" />
    </marker>
  </defs>

  <rect width="1260" height="640" fill="#f8f7f8" />

  <!-- Containers (scope boundaries: dashed 7 3, 1px, stone-200) -->
  <rect x="30" y="120" width="510" height="400" rx="14" fill="none" stroke="#c7c4ca" stroke-width="1" stroke-dasharray="7 3" />
  <rect x="46" y="112" width="172" height="16" fill="#f8f7f8" />
  <text x="52" y="124" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.08em" fill="#79727e">AUTHZED MATERIALIZE</text>

  <rect x="640" y="110" width="210" height="360" rx="14" fill="none" stroke="#c7c4ca" stroke-width="1" stroke-dasharray="7 3" />
  <rect x="650" y="102" width="62" height="16" fill="#f8f7f8" />
  <text x="656" y="114" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.08em" fill="#79727e">SPICEDB</text>

  <rect x="950" y="95" width="240" height="465" rx="14" fill="none" stroke="#c7c4ca" stroke-width="1" stroke-dasharray="7 3" />
  <rect x="960" y="87" width="108" height="16" fill="#f8f7f8" />
  <text x="966" y="99" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="12" font-weight="500" letter-spacing="0.08em" fill="#79727e">YOUR SYSTEMS</text>

  <!-- Boxes: AuthZed Materialize (2x2 grid: Hydrator/Cache Server top, Snapshotter/Event Log bottom) -->
  <g>
    <rect x="60" y="150" width="170" height="90" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="145" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Hydrator</text>
    <text x="145" y="212" text-anchor="middle" font-size="11.5" fill="#79727e">computes permission sets</text>
    <text x="145" y="227" text-anchor="middle" font-size="11.5" fill="#79727e">for watched permissions</text>
  </g>

  <g>
    <rect x="320" y="150" width="190" height="100" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="415" y="190" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Cache Server</text>
    <text x="415" y="212" text-anchor="middle" font-size="11.5" fill="#79727e">serves hydrated</text>
    <text x="415" y="227" text-anchor="middle" font-size="11.5" fill="#79727e">permission sets</text>
  </g>

  <g>
    <rect x="60" y="400" width="170" height="90" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="145" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Snapshotter</text>
    <text x="145" y="462" text-anchor="middle" font-size="11.5" fill="#79727e">periodic snapshots of</text>
    <text x="145" y="477" text-anchor="middle" font-size="11.5" fill="#79727e">schema + relationships</text>
  </g>

  <g>
    <rect x="320" y="400" width="190" height="90" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="415" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Event Log</text>
    <text x="415" y="462" text-anchor="middle" font-size="11.5" fill="#79727e">persists permission</text>
    <text x="415" y="477" text-anchor="middle" font-size="11.5" fill="#79727e">set changes</text>
  </g>

  <!-- Boxes: SpiceDB -->
  <g>
    <rect x="660" y="150" width="170" height="100" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="745" y="205" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">SpiceDB</text>
    <text x="745" y="227" text-anchor="middle" font-size="11.5" fill="#79727e">the service</text>
  </g>

  <g>
    <rect x="660" y="330" width="170" height="100" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="745" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Datastore</text>
    <text x="745" y="397" text-anchor="middle" font-size="11.5" fill="#79727e">underlying storage</text>
  </g>

  <!-- Boxes: Your Systems -->
  <g>
    <rect x="970" y="155" width="200" height="90" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="1070" y="195" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Your Application</text>
    <text x="1070" y="217" text-anchor="middle" font-size="11.5" fill="#79727e">calls SpiceDB exactly as</text>
    <text x="1070" y="232" text-anchor="middle" font-size="11.5" fill="#79727e">it always has</text>
  </g>

  <g>
    <rect x="970" y="310" width="200" height="90" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="1070" y="345" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Event Processor</text>
    <text x="1070" y="367" text-anchor="middle" font-size="11.5" fill="#79727e">backfills + watches</text>
    <text x="1070" y="382" text-anchor="middle" font-size="11.5" fill="#79727e">permission sets</text>
  </g>

  <g>
    <rect x="970" y="430" width="200" height="100" rx="10" fill="#ffffff" stroke="#c7c4ca" stroke-width="1" />
    <text x="1070" y="465" text-anchor="middle" font-size="17" font-weight="700" fill="#1e1424">Your Database</text>
    <text x="1070" y="487" text-anchor="middle" font-size="11.5" fill="#79727e">or search index</text>
    <text x="1070" y="502" text-anchor="middle" font-size="11.5" fill="#79727e">(colocated permissions)</text>
  </g>

  <!-- Arrows (connectors: orthogonal, 1.5px, rounded 10px corners, stone-400 neutral) -->
  <!-- 1: Snapshotter -> Hydrator (same column, straight up) -->
  <path d="M145,400 V242" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  <text x="160" y="325" font-size="12" fill="#655d69">snapshot</text>

  <!-- 2: Hydrator -> Cache Server (same row, straight across) -->
  <path d="M228,197 H318" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  <text x="273" y="176" text-anchor="middle" font-size="11.5" fill="#655d69">hydrated</text>
  <text x="273" y="189" text-anchor="middle" font-size="11.5" fill="#655d69">permission sets</text>

  <!-- 3: Cache Server -> Event Log (same column, straight down) -->
  <path d="M415,252 V398" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  <text x="405" y="310" text-anchor="end" font-size="12" fill="#655d69">permission set</text>
  <text x="405" y="325" text-anchor="end" font-size="12" fill="#655d69">changes</text>

  <!-- 4: SpiceDB <-> Datastore -->
  <path d="M745,250 V328" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)" />
  <text x="745" y="293" text-anchor="middle" font-size="11.5" fill="#655d69">reads / writes</text>

  <!-- 5: Datastore -> Snapshotter, routed via the bottom margin, rounded corners -->
  <path d="M660,410 L610,410 A10,10 0 0,0 600,420 L600,535 A10,10 0 0,1 590,545 L155,545 A10,10 0 0,1 145,535 L145,492"
        fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  <text x="270" y="562" text-anchor="middle" font-size="12" fill="#655d69">schema + relationships</text>

  <!-- 6: SpiceDB <-> Cache Server (Accelerated Queries dispatch) — straight, teal = active path -->
  <path d="M660,200 H512" fill="none" stroke="#72b1ad" stroke-width="1.5" marker-end="url(#arrow-teal)" marker-start="url(#arrow-teal)" />
  <text x="586" y="180" text-anchor="middle" font-size="11.5" fill="#4a7d7b" font-weight="600">Accelerated</text>
  <text x="586" y="193" text-anchor="middle" font-size="11.5" fill="#4a7d7b" font-weight="600">Queries</text>

  <!-- 7: Datastore -> Cache Server (direct real-time watch) — dotted (a deliberate variant marking a passive-watch connection, distinct from the request/response connectors) -->
  <path d="M660,350 L610,350 A10,10 0 0,1 600,340 L600,310 A10,10 0 0,0 590,300 L470,300 A10,10 0 0,1 460,290 L460,252"
        fill="none" stroke="#8e8891" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 6" marker-end="url(#arrow-neutral)" />
  <text x="530" y="265" text-anchor="middle" font-size="11.5" fill="#655d69">watches datastore</text>
  <text x="530" y="279" text-anchor="middle" font-size="11.5" fill="#655d69">directly (real-time)</text>

  <!-- 8: SpiceDB <-> Your Application (normal SpiceDB API calls, unchanged by Materialize) — short, direct path -->
  <path d="M830,200 H968" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" marker-start="url(#arrow-neutral)" />
  <text x="899" y="188" text-anchor="middle" font-size="11.5" fill="#655d69">checks + lookups</text>

  <!-- 9: Event Log <-> Event Processor (Event Streams) — violet, rounded corners -->
  <path d="M415,490 L415,575 A10,10 0 0,0 425,585 L910,585 A10,10 0 0,0 920,575 L920,365 A10,10 0 0,1 930,355 L968,355"
        fill="none" stroke="#7a5ce6" stroke-width="1.5" marker-end="url(#arrow-violet)" marker-start="url(#arrow-violet)" />
  <text x="650" y="573" text-anchor="middle" font-size="12.5" fill="#6242e0" font-weight="600">Event Streams</text>

  <!-- 10: Event Processor -> Your Database -->
  <path d="M1070,400 V428" fill="none" stroke="#8e8891" stroke-width="1.5" marker-end="url(#arrow-neutral)" />
  <text x="1095" y="418" font-size="12" fill="#655d69">stores permission sets</text>
</svg>
